 const snap=(id,v)=>({id,exists:v!=null,data:()=>v});

   return {get:async()=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{headers:auth()});const x=await j(r);return snap(i,x.data)},

     update:async v=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{method:'PATCH',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify(v)});await j(r)},
     delete:async()=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{method:'DELETE',headers:auth()});await j(r)}}};
 const q=(c,f=[])=>({where:(k,o,v)=>q(c,[...f,[k,o,v]]),get:async()=>{const params=new URLSearchParams();for(const [k,o,v] of f){params.append('where',k);params.append('op',o);params.append('value',typeof v==='string'?v:JSON.stringify(v))}const r=await fx(base+'/api/collection/'+encodeURIComponent(c)+(params.toString()?'?'+params:''),{headers:auth()});const x=await j(r);const d=(x.docs||[]).map(a=>snap(a.id,a.data));return{docs:d,empty:!d.length}},onSnapshot(cb,er){let last='';let stopped=false;const tick=async()=>{if(stopped)return;try{const r=await this.get(),j=JSON.stringify(r.docs.map(d=>[d.id,d.data()]));if(j!==last){last=j;cb(r)}}catch(e){if(er)er(e)}};tick();const t=setInterval(tick,1200);return()=>{stopped=true;clearInterval(t)}}});

function loginDeviceInfo(){
 const ua=navigator.userAgent||'';
 let os='Неизвестная ОС';
 if(/Windows NT/i.test(ua))os='Windows';
 else if(/Android/i.test(ua))os='Android';
 else if(/iPhone|iPad|iPod/i.test(ua))os='iOS';
 else if(/Mac OS X/i.test(ua))os='macOS';
 else if(/Linux/i.test(ua))os='Linux';
 let browser='Неизвестный браузер';
 if(/Edg\//i.test(ua))browser='Microsoft Edge';
 else if(/Chrome\//i.test(ua))browser='Google Chrome';
 else if(/Firefox\//i.test(ua))browser='Mozilla Firefox';
 else if(/Safari\//i.test(ua)&&!/Chrome\//i.test(ua))browser='Safari';
 return os+' · '+browser+(navigator.platform?' · '+navigator.platform:'');
}

const b64u=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b};
const secretGenerate=()=>b64u(crypto.getRandomValues(new Uint8Array(32)));
async function secretKey(raw){if(!raw||raw.length<40)throw new Error('Неверный секретный ключ');return crypto.subtle.importKey('raw',unb64u(raw),'AES-GCM',false,['encrypt','decrypt'])}
async function secretEncrypt(raw,text){const iv=crypto.getRandomValues(new Uint8Array(12)),key=await secretKey(raw),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return{iv:b64u(iv),ct:b64u(new Uint8Array(ct))}}
async function secretDecrypt(raw,m){try{const key=await secretKey(raw),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(m.iv)},key,unb64u(m.ct));return new TextDecoder().decode(pt)}catch(e){return '🔒 Не удалось расшифровать. Проверьте секретный ключ.'}}

 document.body.appendChild(d);

 d.querySelector('#newk').onclick=()=>{inp.value=secretGenerate();inp.select()};
 d.querySelector('#copyk').onclick=async()=>{const v=inp.value.trim();if(!v)return alert('Сначала создайте или введите ключ');try{await navigator.clipboard.writeText(v);alert('Ключ скопирован')}catch(e){inp.select();alert('Не удалось скопировать. Выделите ключ и скопируйте его вручную.')}};
 d.querySelector('#savek').onclick=()=>{const v=inp.value.trim();if(v.length<40)return alert('Ключ слишком короткий');setSecretRaw(oid,v);d.remove();onDone(true)};

async function deleteCallArtifacts(id){try{const s=await db.collection('callCandidates').where('callId','==',id).get();await Promise.all((s.docs||[]).map(x=>db.doc('callCandidates/'+x.id).delete().catch(()=>{})))}catch(e){}}
async function finishCall(status){
  const a=activeCall;if(!a)return;activeCall=null;try{a.pc?.close()}catch(e){}try{a.localStream?.getTracks().forEach(t=>t.stop())}catch(e){}try{a.remoteStream?.getTracks().forEach(t=>t.stop())}catch(e){}try{a.unsubCall?.()}catch(e){}try{a.unsubCandidates?.()}catch(e){}
  const ov=document.getElementById('ekoCallOverlay');if(ov)ov.remove();
  if(status&&a.id){try{await db.doc(callDocId(a.id)).update({status,endedAt:Date.now()})}catch(e){}}if(a.id)setTimeout(()=>deleteCallArtifacts(a.id),2500);
}
function closeCall(){return finishCall('ended')}
function watchCallCandidates(a){
  const q=db.collection('callCandidates').where('callId','==',a.id).where('to','==',me.id);
  a.unsubCandidates=q.onSnapshot(async s=>{for(const d of(s.docs||[])){if(a.seenCandidates.has(d.id))continue;a.seenCandidates.add(d.id);const x=d.data();if(!x?.candidate)continue;if(a.pc.remoteDescription){try{await a.pc.addIceCandidate(new RTCIceCandidate(x.candidate))}catch(e){}}else a.pendingCandidates.push(x.candidate)}});
}
async function flushCallCandidates(a){for(const x of a.pendingCandidates.splice(0)){try{await a.pc.addIceCandidate(new RTCIceCandidate(x))}catch(e){}}}
function wirePeer(a){
  a.pc.onicecandidate=async e=>{if(!e.candidate)return;try{await db.doc('callCandidates/'+callCandidateId(a.id)).set({callId:a.id,a:me.id,b:a.other,from:me.id,to:a.other,candidate:rtcCandidate(e.candidate),ts:Date.now()})}catch(e){}};
  a.pc.ontrack=e=>{const s=e.streams?.[0];if(!s)return;a.remoteStream=s;if(a.kind==='video'){const v=document.getElementById('ekoRemoteVideo');if(v){v.srcObject=s;v.play?.().catch(()=>{})}}else{const x=document.getElementById('ekoRemoteAudio');if(x){x.srcObject=s;x.play?.().catch(()=>{})}}};
  a.pc.onconnectionstatechange=()=>{const s=a.pc.connectionState;if(s==='connected')setCallStatus('Соединение установлено');if(s==='failed'){setCallStatus('Не удалось соединиться');setTimeout(()=>finishCall('failed'),900)}};
}

async function getCallMedia(kind){if(!navigator.mediaDevices?.getUserMedia)throw new Error('Камера и микрофон доступны только по HTTPS.');return navigator.mediaDevices.getUserMedia(kind==='video'?{audio:true,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}}:{audio:true,video:false})}
async function startCall(oid,kind){
  if(activeCall)return alert('У вас уже есть активный звонок.');
  await loadCallIce();const o=await getUser(oid);if(!o)return alert('Пользователь не найден.');let stream;
  try{stream=await getCallMedia(kind)}catch(e){return alert('Не удалось включить '+(kind==='video'?'камеру и микрофон':'микрофон')+'. Разрешите доступ в браузере и попробуйте ещё раз.')}
  const id=callId(),a=activeCall={id,other:oid,kind,pc:null,localStream:stream,remoteStream:null,incoming:false,seenCandidates:new Set(),pendingCandidates:[]};
  callOverlay({name:o.name||o.username||'Пользователь',kind,statusText:'Вызов…'});if(kind==='video'){const v=document.getElementById('ekoLocalVideo');if(v){v.srcObject=stream;v.play?.().catch(()=>{})}}
  const pc=a.pc=new RTCPeerConnection(CALL_ICE);wirePeer(a);stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  try{
    await db.doc(callDocId(id)).set({a:me.id,b:oid,kind,status:'ringing',createdAt:Date.now(),offer:null,answer:null});watchCallCandidates(a);
    const poll=async()=>{if(!activeCall||activeCall.id!==id)return;try{const s=await db.doc(callDocId(id)).get(),d=s.data();if(d?.status==='rejected'||d?.status==='ended'||d?.status==='failed'){setCallStatus(d.status==='rejected'?'Вызов отклонён':'Вызов завершён');setTimeout(()=>finishCall(null),700);return}if(d?.answer&&!pc.remoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(d.answer));await flushCallCandidates(a)}}catch(e){}if(activeCall&&activeCall.id===id)a.callTimer=setTimeout(poll,800)};
    a.unsubCall=()=>clearTimeout(a.callTimer);await pc.setLocalDescription(await pc.createOffer());await db.doc(callDocId(id)).update({offer:rtcDescription(pc.localDescription)});bindCallControls(a);setCallStatus('Вызов отправлен…');poll();
  }catch(e){alert('Не удалось начать звонок: '+(e.message||e));await finishCall('failed')}
}
async function acceptCall(data){
  if(activeCall)return;
  await loadCallIce();const o=await getUser(data.a)||{name:'Пользователь'};let stream;
  try{stream=await getCallMedia(data.kind)}catch(e){try{await db.doc(callDocId(data.id)).update({status:'ended',endedAt:Date.now()})}catch(_){};return alert('Нужен доступ к '+(data.kind==='video'?'камере и микрофону':'микрофону')+'. Разрешите его в браузере.')}
  const a=activeCall={id:data.id,other:data.a,kind:data.kind,pc:null,localStream:stream,remoteStream:null,incoming:true,seenCandidates:new Set(),pendingCandidates:[]};
  callOverlay({name:o.name||o.username||'Пользователь',kind:data.kind});if(data.kind==='video'){const v=document.getElementById('ekoLocalVideo');if(v){v.srcObject=stream;v.play?.().catch(()=>{})}}
  const pc=a.pc=new RTCPeerConnection(CALL_ICE);wirePeer(a);stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  try{await pc.setRemoteDescription(new RTCSessionDescription(data.offer));watchCallCandidates(a);await flushCallCandidates(a);await pc.setLocalDescription(await pc.createAnswer());await db.doc(callDocId(data.id)).update({answer:rtcDescription(pc.localDescription),status:'accepted',acceptedAt:Date.now()});bindCallControls(a);setCallStatus('Соединение…');const poll=async()=>{if(!activeCall||activeCall.id!==data.id)return;try{const s=await db.doc(callDocId(data.id)).get(),d=s.data();if(d?.status==='ended'||d?.status==='rejected'||d?.status==='failed'){setCallStatus('Вызов завершён');setTimeout(()=>finishCall(null),500);return}}catch(e){}if(activeCall&&activeCall.id===data.id)a.callTimer=setTimeout(poll,800)};a.unsubCall=()=>clearTimeout(a.callTimer);poll()}
  catch(e){alert('Не удалось принять звонок: '+(e.message||e));await finishCall('failed')}
}

function shrink(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let m=max,qq=q,out;for(let k=0;k<8;k++){const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qq);if(out.length<170000)break;qq=Math.max(.4,qq-.1);m=Math.round(m*.85)}res(out)};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

 <p style="margin-top:16px"><b>Юзернеймы</b></p><div>${u.username?'<div class="note">@'+esc(u.username)+' (основной)</div>':''}${(u.extra||[]).map(x=>`<div class="row" style="cursor:default"><div style="flex:1">@${esc(x)}</div><button class="ib" data-rx="${esc(x)}">✕</button></div>`).join('')}</div><input class="t" id="xu" placeholder="Выдать юзернейм (до 3 доп.)"><button class="ib" id="xg">Выдать</button>
 ${isAdmin?`<p style="margin-top:16px"><b>💰 Баланс: ${u.coins||0} ЕКОКоинов</b></p><input class="t" id="ca" type="number" min="1" placeholder="Сумма"><button class="ib" id="cp">Начислить</button> <button class="ib" id="cm">Списать</button>
 <p style="margin-top:16px"><b>★ Premium:</b> ${isPrem(u)?'до '+new Date(u.premiumUntil).toLocaleDateString():'нет'}</p><select id="pd" class="t"><option value="30">1 месяц</option><option value="90">3 месяца</option><option value="360">1 год</option></select><button class="ib" id="pg">Выдать Premium</button> <button class="ib" id="pr">Снять</button>

 <p style="margin-top:16px"><b>Блок на время</b></p><select id="du" class="t"><option value="3600000">1 час</option><option value="86400000">1 день</option><option value="604800000">7 дней</option><option value="2592000000">30 дней</option></select>
 <button class="ib" id="bl">Заблокировать</button> <button class="ib" id="ub">Снять блок</button>
 <p style="margin-top:20px"><button class="pr" id="dl" style="background:#e53935">Удалить аккаунт</button></p></div>`;

  if((await db.doc('usernames/'+x).get()).exists)return alert('Юзернейм занят');await db.doc('usernames/'+x).set({uid:id});await up({extra:[...(u.extra||[]),x]})};

 $('#bl').onclick=()=>up({blockedUntil:Date.now()+ +$('#du').value});$('#ub').onclick=()=>up({blockedUntil:0});
