.bd{font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:2px 5px;margin-left:5px;vertical-align:2px}.bs{background:#e53935}.bf{background:#f59e0b}.warn{background:#fdecea;color:#b71c1c;border-radius:10px;padding:8px;margin-bottom:8px;font-size:13px;text-align:center}.nav{display:flex;border-top:1px solid var(--th)}.nav button{flex:1;background:none;border:0;padding:8px;font-size:11px;color:var(--mut);cursor:pointer}.nav .on{color:var(--pr);font-weight:600}.nav div{font-size:20px}.cel{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0006}.cel i{position:absolute;width:8px;height:14px;border-radius:2px;animation:burst 2.2s ease-out forwards}.cel .pp{position:absolute;bottom:3%;font-size:52px;animation:pop .6s}.cel .msg{background:var(--card);border-radius:20px;padding:22px;text-align:center;width:min(86vw,320px);animation:pop .5s .3s both}@keyframes burst{0%{transform:translate(0,0) rotate(0)}45%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}100%{transform:translate(var(--dx),calc(var(--dy) + 70vh)) rotate(calc(var(--r) * 2));opacity:0}}@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}.pst{display:inline-block;color:rgba(168,85,247,.7);margin-left:4px;text-shadow:0 0 6px rgba(168,85,247,.9),0 0 16px rgba(168,85,247,.6);animation:shine 2.2s ease-in-out infinite}@keyframes shine{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}.pst[data-u]{cursor:pointer}.own{cursor:pointer;margin-left:4px;font-size:.9em}.gbox{font-size:64px;display:inline-block}.gbox.sh{animation:shake .85s}.gbox.rv{animation:pop .6s both}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(14deg) scale(1.15)}60%{transform:rotate(-10deg) scale(1.2)}80%{transform:rotate(10deg) scale(1.1)}}.note{color:var(--mut);font-size:12px;margin-top:10px}.secret-badge{display:inline-block;margin-right:5px;opacity:.75}.tester-badge{display:inline-block;margin-left:5px;padding:2px 7px;border-radius:999px;background:rgba(91,108,255,.13);color:var(--pr);font-size:11px;font-weight:800;cursor:pointer;vertical-align:2px}.tester-badge:hover{background:rgba(91,108,255,.22)}.ceo-badge{display:inline-block;margin-left:5px;padding:2px 7px;border-radius:999px;background:linear-gradient(135deg,#fff1a8,#ffd54a);color:#6b4b00;font-size:11px;font-weight:900;cursor:pointer;vertical-align:2px;box-shadow:0 1px 6px rgba(255,193,7,.25)}.ceo-badge:hover{filter:brightness(.97)}

<script>
if(location.search.includes('desktop=1'))document.documentElement.classList.add('desktop');

function testerInfo(e){if(e&&e.stopPropagation)e.stopPropagation();const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:220;padding:20px';d.innerHTML='<div style="background:var(--card);color:var(--tx);border-radius:20px;padding:22px;width:min(88vw,360px);text-align:center;box-shadow:var(--sh)"><div style="font-size:42px">🧪</div><h3 style="margin:6px 0 8px">Метка «Тестер»</h3><p style="color:var(--mut);line-height:1.5;margin:0">Этот пользователь участвует в тестировании новых функций EKOOOL. Метка означает статус тестера и помогает отличать участников тестирования.</p><button class="pr" id="tc" style="margin-top:16px">Понятно</button></div>';document.body.appendChild(d);d.querySelector('#tc').onclick=()=>d.remove();d.onclick=x=>{if(x.target===d)d.remove()}}function ceoInfo(e){if(e&&e.stopPropagation)e.stopPropagation();const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:220;padding:20px";d.innerHTML='<div style="background:var(--card);color:var(--tx);border-radius:20px;padding:22px;width:min(88vw,360px);text-align:center;box-shadow:var(--sh)"><div style="font-size:42px">👑</div><h3 style="margin:6px 0 8px">Метка «CEO»</h3><p style="color:var(--mut);line-height:1.5;margin:0">Эта метка обозначает что этот пользователь является администратором или владельцам данного мессенджера, обычно, она выдаётся через админ-панель.</p><button class="pr" id="ceoc" style="margin-top:16px">Понятно</button></div>';document.body.appendChild(d);d.querySelector("#ceoc").onclick=()=>d.remove();d.onclick=x=>{if(x.target===d)d.remove()}}
function toast(m){const t=document.createElement('div');t.textContent=String(m);t.style.cssText='position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:14px;z-index:200;max-width:86vw;text-align:center;font-size:14px;white-space:pre-wrap';document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
window.alert=toast;
function askConfirm(m){return new Promise(res=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:150';d.innerHTML='<div style="background:var(--card);color:var(--tx);border-radius:18px;padding:20px;width:min(88vw,340px);text-align:center"><p style="white-space:pre-wrap"></p><button class="pr" id="ok">Да</button> <button class="ib" id="no">Отмена</button></div>';d.querySelector('p').textContent=m;document.body.appendChild(d);const f=v=>{d.remove();res(v)};d.querySelector('#ok').onclick=()=>f(true);d.querySelector('#no').onclick=()=>f(false)})}
addEventListener('unhandledrejection',e=>{const r=e.reason;toast('Ошибка: '+((r&&r.code)?r.code+' — ':'')+((r&&r.message)||r))});
addEventListener('error',e=>toast('Ошибка: '+e.message));
const VF='<svg class="vf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let db=null,isAdmin=false,me=null,cache={},unsub=[];
// ---- storage: server-backed shared database ----
const retry=async f=>{for(let i=0;;i++){try{return await f()}catch(e){if(i<3&&e&&(e.code==='resource_exhausted'||e.code==='unavailable')){await new Promise(r=>setTimeout(r,500*(i+1)+Math.random()*300));continue}throw e}}};
const wrapQ=q=>({where:(k,o,v)=>wrapQ(q.where(k,o,v)),get:()=>retry(()=>q.get()),onSnapshot:(cb,er)=>q.onSnapshot(cb,er||(()=>{}))});
const wrapDb=d=>({doc:p=>{const r=d.doc(p);return{get:()=>retry(()=>r.get()),set:v=>retry(()=>r.set(v)),update:v=>retry(()=>r.update(v)),delete:()=>retry(()=>r.delete())}},collection:c=>wrapQ(d.collection(c))});
function apiDb(){
 const base='';
 const fx=async(url,opt={})=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),4500);try{return await fetch(url,{...opt,signal:ac.signal})}finally{clearTimeout(tm)}};
 const auth=()=>{try{
   const h={};const t=localStorage.EKOOOL_ADMIN_TOKEN;if(t)h.Authorization='Bearer '+t;
   if(me&&me.id&&me.passHash){h['X-EKOOOL-User']=me.id;h['X-EKOOOL-Proof']=me.passHash}
   return h;
 }catch(e){return{}}};
 const j=async(r)=>{const x=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(x.error||('HTTP '+r.status));e.code=x.code||('http_'+r.status);throw e}return x};
 const snap=(id,v)=>({id,exists:v!=null,data:()=>v});
 const doc=p=>{const [c,...rest]=String(p).split('/'),i=rest.join('/');
   return {get:async()=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{headers:auth()});const x=await j(r);return snap(i,x.data)},
     set:async v=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{method:'PUT',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify(v)});await j(r)},
     update:async v=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{method:'PATCH',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify(v)});await j(r)},
     delete:async()=>{const r=await fx(base+'/api/doc/'+encodeURIComponent(c)+'/'+encodeURIComponent(i),{method:'DELETE',headers:auth()});await j(r)}}};
 const q=(c,f=[])=>({where:(k,o,v)=>q(c,[...f,[k,o,v]]),get:async()=>{const params=new URLSearchParams();for(const [k,o,v] of f){params.append('where',k);params.append('op',o);params.append('value',typeof v==='string'?v:JSON.stringify(v))}const r=await fx(base+'/api/collection/'+encodeURIComponent(c)+(params.toString()?'?'+params:''),{headers:auth()});const x=await j(r);const d=(x.docs||[]).map(a=>snap(a.id,a.data));return{docs:d,empty:!d.length}},onSnapshot(cb,er){let last='';let stopped=false;const tick=async()=>{if(stopped)return;try{const r=await this.get(),j=JSON.stringify(r.docs.map(d=>[d.id,d.data()]));if(j!==last){last=j;cb(r)}}catch(e){if(er)er(e)}};tick();const t=setInterval(tick,1200);return()=>{stopped=true;clearInterval(t)}}});
 return{doc,collection:c=>q(c)}}
async function sessionLogin(uid,proof){
 try{
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),3000);
  const r=await fetch('/api/auth/session',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({uid,proof}),signal:ac.signal});
  clearTimeout(tm);return r.ok;
 }catch(e){return false}
}

 try{
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),3000);

  clearTimeout(tm);if(!r.ok)return null;
  const x=await r.json();return x.id||null;
 }catch(e){return null}
}
async function sessionLogout(){
 try{await fetch('/api/auth/logout',{method:'POST',credentials:'include'})}catch(e){}
}
async function adminLogin(){const p=prompt('Пароль администратора EKOOOL:');if(!p)return false;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}),x=await r.json();if(!r.ok||!x.token){toast(x.error||'Неверный пароль');return false}localStorage.EKOOOL_ADMIN_TOKEN=x.token;isAdmin=true;return true}catch(e){toast('Не удалось подключиться к серверу');return false}}
