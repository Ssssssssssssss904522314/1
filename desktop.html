<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>EKOOOL — Desktop</title>
<link rel="manifest" href="/desktop-manifest.json">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#080b12;color:#eef1fa}
.shell{height:100%;display:grid;grid-template-columns:240px 1fr;grid-template-rows:58px 1fr}
.side{grid-row:1/3;background:linear-gradient(180deg,#101421,#0b0e16);border-right:1px solid #202638;padding:18px 14px}
.logo{font-size:23px;font-weight:900;letter-spacing:-.8px;padding:2px 10px 24px}
.logo span{color:#7b6cff}.item{padding:12px 13px;border-radius:13px;color:#9ba3b8;margin:5px 0;font-weight:650}.item.active{background:#171d2c;color:#fff}.info{position:absolute;bottom:16px;font-size:11px;color:#656d82;padding:0 12px}
.head{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #202638;background:#0d111b;gap:12px}
.status{font-size:12px;color:#75e6a3;margin-left:auto}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d878;margin-right:6px}
.frame{width:100%;height:100%;border:0;background:#0d111b}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.head{padding:0 12px}.frame{height:calc(100vh - 58px)}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="logo">EK<span>OOOL</span></div>
  <div class="item active">💬 Мессенджер</div>
  <div class="item">🔔 Уведомления</div>
  <div class="item">⚙️ Настройки</div>
  <div class="info">EKOOOL Desktop<br>Все данные синхронизируются с сервером</div>
</aside>
<header class="head"><strong>EKOOOL Messenger</strong><span class="status"><i class="dot"></i>Сервер подключён</span></header>
<main><iframe class="frame" src="/?desktop=1" title="EKOOOL Messenger"></iframe></main>
</div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('/desktop-sw.js').catch(()=>{});
</script>
</body>
</html>
